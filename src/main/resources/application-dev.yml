spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thirds}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DB_HIBERNATE_DDL_AUTO:create-drop}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
      file-size-threshold: 2KB
      resolve-lazily: false

  h2:
    console:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs}
          
server:
  port: ${PORT:0}
  tomcat:
    connection-timeout: 60000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10
    max-http-form-post-size: 10MB

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    org:
      Keycloak: ${KEYCLOAK_LOG_LEVEL:DEBUG}
jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTR:preferred_username}
      resource-id: ${JWT_RESOURCE_ID:microservices_client}

management:
  endpoint:
    health:
      probes:
        enabled: true

file-upload:
  max-size: 5242880
  allowed-extensions:
    excel:
      - ".xlsx"
      - ".xls"
    pdf:
      - ".pdf"
  allowed-mime-types:
    excel:
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - "application/vnd.ms-excel"
    pdf:
      - "application/pdf"