# Configuración para carga de datos geográficos
geography:
  data:
    base-directory: "data/geography"
    phases:
      countries:
        - "01_countries.sql"
      states:
        - "02_states.sql"
      cities-pattern: "**/*cities*.sql"
    countries:
      colombia:
        directory: "colombia"
        enabled: true
      usa:
        directory: "usa" 
        enabled: true
      mexico:
        directory: "mexico"
        enabled: true
